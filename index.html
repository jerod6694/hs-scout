<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HS Scout">
<meta name="theme-color" content="#020617">
<title>HS Baseball Dugout Scout</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><circle cx='50' cy='50' r='36' fill='%23f8fafc'/><path d='M32 20 Q46 50 32 80 M68 20 Q54 50 68 80' stroke='%23ef4444' stroke-width='4' fill='none' stroke-dasharray='5,4'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><circle cx='50' cy='50' r='36' fill='%23f8fafc'/><path d='M32 20 Q46 50 32 80 M68 20 Q54 50 68 80' stroke='%23ef4444' stroke-width='4' fill='none' stroke-dasharray='5,4'/></svg>">

<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; padding-top: env(safe-area-inset-top); }
  header {
    background: #020617; padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  header input {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 8px; font-weight: bold; font-size: 16px; width: 65%;
  }
  .btn-sm {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #020617; border: none; font-weight: 700; }
  .btn-danger { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
  nav { display: flex; background: #020617; border-bottom: 1px solid var(--border); }
  nav button {
    flex: 1; padding: 14px 8px; background: none; border: none; color: var(--muted);
    font-weight: 700; font-size: 14px; border-bottom: 3px solid transparent; cursor: pointer;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .container { padding: 12px; max-width: 700px; margin: 0 auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea {
    background: #0f172a; border: 1px solid var(--border); color: var(--text);
    padding: 10px; border-radius: 8px; font-size: 15px;
  }
  textarea { width: 100%; resize: vertical; min-height: 60px; }
  .tag-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tag {
    padding: 7px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
    background: #0f172a; border: 1px solid var(--border); color: var(--muted); cursor: pointer; user-select: none;
  }
  .tag.active { background: var(--accent); color: #020617; border-color: var(--accent); }
  .tag.warn.active { background: var(--yellow); color: #020617; border-color: var(--yellow); }
  .field-wrap { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
  svg.diamond { width: 100%; max-width: 280px; height: auto; touch-action: manipulation; cursor: crosshair; }
  .hit-type-bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .hit-btn {
    padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--border); background: #0f172a; color: var(--text); cursor: pointer;
  }
  .hit-btn.active[data-type="GB"] { background: var(--yellow); color: #000; }
  .hit-btn.active[data-type="LD"] { background: var(--green); color: #000; }
  .hit-btn.active[data-type="FB"] { background: var(--accent); color: #000; }
  .pitch-grid { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  .pitch-grid th, .pitch-grid td { border: 1px solid var(--border); padding: 6px; text-align: center; }
  .pitch-btn {
    width: 100%; padding: 10px 4px; background: #0f172a; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-weight: 700; cursor: pointer;
  }
  .pitch-btn:active { background: var(--accent); color: #000; }
  .bar-bg { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; background: var(--accent); }
  .status-pill { font-size: 11px; color: var(--green); text-align: center; padding: 6px; background: #020617; }
</style>
</head>
<body>

<div class="status-pill" id="offlineStatus">Offline Ready • Data Saved on Device</div>

<header>
  <input type="text" id="oppName" placeholder="Opponent Team Name..." oninput="saveData()">
  <button type="button" class="btn-sm btn-primary" onclick="exportReport()">Share / Copy</button>
</header>

<nav>
  <button type="button" class="active" onclick="switchTab('hitters', this)">Hitters</button>
  <button type="button" onclick="switchTab('pitchers', this)">Pitchers</button>
  <button type="button" onclick="switchTab('team', this)">Catcher & Team</button>
</nav>

<div class="container">
  <div id="tab-hitters" class="tab-content active">
    <div class="card">
      <div class="row">
        <input type="text" id="newHitterNum" placeholder="#" style="width: 55px;">
        <input type="text" id="newHitterName" placeholder="Batter Name" style="flex: 1;">
        <select id="newHitterBats">
          <option value="R">Bats R</option>
          <option value="L">Bats L</option>
          <option value="S">Switch</option>
        </select>
        <button type="button" class="btn-sm btn-primary" onclick="addHitter()">+ Add</button>
      </div>
    </div>
    <div id="hittersList"></div>
  </div>

  <div id="tab-pitchers" class="tab-content">
    <div class="card">
      <div class="row">
        <input type="text" id="newPitcherNum" placeholder="#" style="width: 55px;">
        <input type="text" id="newPitcherName" placeholder="Pitcher Name" style="flex: 1;">
        <select id="newPitcherThrows">
          <option value="RHP">RHP</option>
          <option value="LHP">LHP</option>
        </select>
        <button type="button" class="btn-sm btn-primary" onclick="addPitcher()">+ Add</button>
      </div>
    </div>
    <div id="pitchersList"></div>
  </div>

  <div id="tab-team" class="tab-content">
    <div class="card">
      <h3 style="margin-top:0;">Catcher Scouting</h3>
      <div class="row">
        <input type="text" id="catcherInfo" placeholder="Catcher # & Name" style="flex:1;" oninput="saveData()">
        <select id="catcherArm" onchange="saveData()">
          <option value="">Arm Strength...</option>
          <option value="Weak Arm">Weak Arm (Run on him)</option>
          <option value="Average Arm">Average Arm</option>
          <option value="Strong Arm">Strong / Accurate Arm</option>
        </select>
      </div>
      <div class="tag-grid" id="catcherTags"></div>
      <textarea id="catcherNotes" placeholder="Pop time, blocking ability, throws behind runners..." oninput="saveData()"></textarea>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Team & Coaching Tendencies</h3>
      <div class="tag-grid" id="teamTags"></div>
      <textarea id="teamNotes" placeholder="3rd base coach aggressiveness, first-and-third plays, bunt signs, defensive shifts..." oninput="saveData()"></textarea>
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <button type="button" class="btn-sm btn-danger" onclick="resetAll()">Reset All Game Data</button>
    </div>
  </div>
</div>

<script>
const HITTER_TAGS = ["Bunt Threat", "Fast Runner", "1st Pitch Swinger", "Chases High FB", "Pull Heavy", "Late on FB", "Slap/Drag"];
const PITCHER_TAGS = ["Slow to Plate (>1.4s)", "Good Pickoff Move", "Slide Steps", "Wild / Nibbles", "1st Pitch Strike Heavy"];
const CATCHER_TAGS = ["Blocks Well", "Struggles Blocking", "Throws Behind Runners", "Inaccurate Throws"];
const TEAM_TAGS = ["Aggressive Baserunning", "Heavy Small Ball", "Squeeze Threat", "Steals on 1st Pitch", "Takes Until Strike"];

let state = {
  oppName: '', hitters: [], pitchers: [],
  catcherInfo: '', catcherArm: '', catcherTags: [], catcherNotes: '',
  teamTags: [], teamNotes: ''
};

try {
  const saved = JSON.parse(localStorage.getItem('hs_scout_data'));
  if (saved) state = Object.assign(state, saved);
} catch (e) {}

let currentHitType = {};

function saveData() {
  state.oppName = document.getElementById('oppName').value;
  state.catcherInfo = document.getElementById('catcherInfo').value;
  state.catcherArm = document.getElementById('catcherArm').value;
  state.catcherNotes = document.getElementById('catcherNotes').value;
  state.teamNotes = document.getElementById('teamNotes').value;
  try { localStorage.setItem('hs_scout_data', JSON.stringify(state)); } catch (e) {}
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');

</script>
</body>
</html>
